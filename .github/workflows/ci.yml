# The cross job guards the PRFAQ's claim that noda builds for musl on x86_64 and
# aarch64: the vendored C libraries are what break silently there.
#
# Actions are pinned to commit SHAs, which cannot be repointed the way a tag can;
# the trailing comment names the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels the older run on the same ref, except for tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-nextest
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run

  e2e:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            e2e
      # `e2e/` is its own workspace, so it is linted here, sharing this job's
      # build of thirtyfour.
      - run: cargo fmt --check --manifest-path e2e/Cargo.toml
      - run: cargo clippy --manifest-path e2e/Cargo.toml --all-targets -- -D warnings
      # Built first so a compile error in noda reads as one, not as a browser
      # finding nothing listening.
      - run: cargo build
      # The runner has Chrome; only the matching chromedriver is downloaded.
      - run: cargo test --manifest-path e2e/Cargo.toml --test e2e

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-deny
      # Can fail with no change here, when a new advisory is published.
      - run: cargo deny check

  cross:
    name: cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --target ${{ matrix.target }}
      # Vendoring exists to ship one file that needs nothing installed.
      - name: the binary must be self-contained
        run: |
          binary=target/${{ matrix.target }}/release/noda
          file "$binary"
          file "$binary" | grep -Eq 'static' || {
            echo "::error::$binary is not statically linked"
            exit 1
          }

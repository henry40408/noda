# The build job guards the claim that noda is one static binary on
# x86_64 and aarch64: a cgo dependency is what breaks that silently.
#
# Actions are pinned to commit SHAs, which cannot be repointed the way a tag can;
# the trailing comment names the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels a pull request's older run; on `main` every commit is
# run to the end, so back-to-back merges each get verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -mod=vendor -trimpath -o noda ./cmd/noda
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      # noda ships as one file that needs nothing installed but git.
      - name: the binary must be static
        run: |
          file noda
          file noda | grep -Eq 'statically linked' || {
            echo "::error::noda is not statically linked"
            exit 1
          }

  deps:
    name: deps
    runs-on: ubuntu-latest
    env:
      # The root module allows only these. `e2e/` additionally allows MPL-2.0
      # (godog's go-memdb and friends); MPL-2.0 must not reach the root module,
      # which ships in the image.
      ALLOWED_LICENSES: Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MIT-0,Zlib,Unlicense,CC0-1.0,Unicode-3.0,BSL-1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
      - run: scripts/check-dep-age.sh
      # go-licenses needs GOROOT set explicitly, else it fails on the standard
      # library with "does not have module info". The module's own LICENSE is
      # not a dependency, so it is ignored.
      - run: |
          GOROOT="$(go env GOROOT)" go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --include_tests --ignore github.com/henry40408/noda \
            --allowed_licenses="$ALLOWED_LICENSES"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # e2e/ is its own module, so none of the above reached it.
      - name: e2e module
        working-directory: e2e
        run: |
          go mod tidy -diff
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
          ../scripts/check-dep-age.sh
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: |
          GOROOT="$(go env GOROOT)" go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --include_tests --ignore github.com/henry40408/noda/e2e \
            --allowed_licenses="$ALLOWED_LICENSES,MPL-2.0"
        working-directory: e2e

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          unformatted="$(git ls-files -z '*.go' | grep -zvE '(^|/)vendor/' | xargs -0 gofmt -l 2>&1)"
          echo "$unformatted"
          test -z "$unformatted"
      - run: go vet -mod=vendor ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: e2e module
        working-directory: e2e
        run: |
          go vet -mod=vendor ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      # One toolchain for both modules, or a bump in one is missed in the other.
      - name: e2e uses the root go and toolchain lines
        run: |
          for key in go toolchain; do
            test "$(grep "^$key " go.mod)" = "$(grep "^$key " e2e/go.mod)"
          done

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -mod=vendor -race ./...

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # chromedp's own search prefers a chromium on PATH over google-chrome, so
      # the browser the runner reports is pinned.
      - name: Pin the browser
        run: echo "E2E_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: go test -mod=vendor -count=1 -timeout 25m ./...
        working-directory: e2e

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # `-coverprofile` ignores the binary cmd/noda's tests exec; with
      # NODA_COVERDIR set they build that binary with `-cover`.
      - run: |
          NODA_COVERDIR="$PWD/covdata" go test -mod=vendor -coverprofile=coverage.out ./...
          go tool covdata textfmt -i=covdata -o coverage-bin.out
          tail -n +2 coverage-bin.out >> coverage.out
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henry40408/noda
          files: coverage.out
          # Coverage is a signal, not a gate. Dependabot PRs cannot read
          # repository secrets.
          fail_ci_if_error: false

  # Pushes mutate the whole module; pull requests mutate only the lines changed
  # against the base branch. The efficacy threshold lives in `.gremlins.yaml`
  # (gremlins v0.6.0 silently ignores `--threshold-efficacy` on the command
  # line), and so does the `e2e/` and `vendor/` exclusion, which
  # `--exclude-files` replaces: every entry below repeats both.
  #
  # The module is split into shards because one whole-module run on a 2-CPU
  # runner took long enough, and held enough memory when a mutant looped, for
  # the runner to be killed with SIGTERM (exit 143, "runner received a shutdown
  # signal"). `unleash` takes one path, so a shard runs `.` with an
  # `--exclude-files` regexp for everything outside it (RE2 has no lookahead,
  # so the matrix lists the complement). The shards must stay disjoint and
  # complete: a NEW PACKAGE OR FILE in a split package (`internal/tui`,
  # `internal/web`) must be added to a shard by hand, or it is mutated by every
  # shard that does not exclude it. Check that `gremlins unleash --dry-run`
  # over the shards sums to the whole-module `Runnable` count. Each shard must
  # reach the threshold by itself.
  mutation-shard:
    name: mutation-shard (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: core
            exclude: '^(e2e|vendor)/|^internal/(cmd|tui|web)/'
          - name: cmd-a
            exclude: '^(e2e|vendor|cmd)/|^internal/(clock|config|gitx|importer|link|markdown|note|notebook|paths|query|remote|sign|style|todo|version|tui|web)/|^internal/cmd/(files|notebooks|sync|search|status|todo|use|env|init|backlinks|retarget|mv|add|restore|tag|bulk|edit|pin|rm|show|path|located|import|readme|subject|editor)\.go'
          - name: cmd-b
            exclude: '^(e2e|vendor|cmd)/|^internal/(clock|config|gitx|importer|link|markdown|note|notebook|paths|query|remote|sign|style|todo|version|tui|web)/|^internal/cmd/(doctor|history|ls|width|init|backlinks|retarget|mv|add|restore|tag|bulk|edit|pin|rm|show|path|located|import|readme|subject|editor)\.go'
          - name: cmd-c
            exclude: '^(e2e|vendor|cmd)/|^internal/(clock|config|gitx|importer|link|markdown|note|notebook|paths|query|remote|sign|style|todo|version|tui|web)/|^internal/cmd/(doctor|history|ls|width|files|notebooks|sync|search|status|todo|use|env)\.go'
          - name: tui-app
            exclude: '^(e2e|vendor|cmd)/|^internal/(cmd|clock|config|gitx|importer|link|markdown|note|notebook|paths|query|remote|sign|style|todo|version|web)/|^internal/tui/(command|field|frame|keys|run|session|theme|view)\.go|^internal/tui/ui/'
          - name: tui-view
            exclude: '^(e2e|vendor|cmd)/|^internal/(cmd|clock|config|gitx|importer|link|markdown|note|notebook|paths|query|remote|sign|style|todo|version|web)/|^internal/tui/(app|app_keys|app_prompt)\.go'
          - name: web-listing
            exclude: '^(e2e|vendor|cmd)/|^internal/(cmd|clock|config|gitx|importer|link|markdown|note|notebook|paths|query|remote|sign|style|todo|version|tui)/|^internal/web/(answer|asset|escape|form|guard|gzip|handlers_read|locks|log|page|page_forms|render|routes|server|silent|theme|watch|watch_handler|work)\.go'
          - name: web-forms
            exclude: '^(e2e|vendor|cmd)/|^internal/(cmd|clock|config|gitx|importer|link|markdown|note|notebook|paths|query|remote|sign|style|todo|version|tui)/|^internal/web/(answer|asset|escape|form|guard|gzip|handlers_write|locks|log|page_listing|render|routes|server|silent|theme|watch|watch_handler|work)\.go'
          - name: web-render
            exclude: '^(e2e|vendor|cmd)/|^internal/(cmd|clock|config|gitx|importer|link|markdown|note|notebook|paths|query|remote|sign|style|todo|version|tui)/|^internal/web/(answer|asset|escape|form|guard|gzip|handlers_read|handlers_write|locks|log|page|page_forms|page_listing|routes|server|silent|theme|watch|watch_handler|work)\.go'
          - name: web-rest
            exclude: '^(e2e|vendor|cmd)/|^internal/(cmd|clock|config|gitx|importer|link|markdown|note|notebook|paths|query|remote|sign|style|todo|version|tui)/|^internal/web/(handlers_read|handlers_write|page|page_forms|page_listing|render)\.go'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `--diff` needs the base branch's history, not a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A cached test result makes gremlins' per-mutant timeout near zero, so
      # nearly every mutant "times out" and the job would pass untested.
      - run: go clean -testcache
      # Never pass `--test-cpu`: gremlins v0.6.0 builds the single argument
      # `-cpu 2`, `go test` rejects it, and every mutant then counts as killed.
      # GOMAXPROCS limits the CPUs instead.
      - name: Mutate the shard (push)
        if: github.event_name != 'pull_request'
        env:
          GOMAXPROCS: "2"
          SHARD_EXCLUDE: ${{ matrix.shard.exclude }}
        run: |
          # A mutant can turn a loop into one that never ends and keeps
          # allocating. Memory then ran out before gremlins' timeout fired and
          # the runner was killed. The address-space limit makes such a test
          # process crash instead, which counts as a killed mutant.
          ulimit -v 4194304
          set -o pipefail
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash \
            --workers 2 --exclude-files "$SHARD_EXCLUDE" . 2>&1 | tee "$RUNNER_TEMP/mutation.log"
      - name: Mutate the changed lines of the shard (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          GOMAXPROCS: "2"
          SHARD_EXCLUDE: ${{ matrix.shard.exclude }}
        run: |
          # Stream the output so a killed runner still leaves a log.
          status=0
          ulimit -v 4194304 # see the push step
          set -o pipefail
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash \
            --workers 2 --exclude-files "$SHARD_EXCLUDE" \
            --diff "origin/$BASE_REF" . 2>&1 | tee "$RUNNER_TEMP/mutation.log" || status=$?
          set +o pipefail
          # A shard whose diff has no mutable Go line (docs, CI only, or other
          # shards' files) yields zero mutants, which gremlins scores as 0% and
          # so fails the threshold. That is not a low score, so treat it as a
          # pass.
          if [ "$status" -ne 0 ] \
            && grep -q '^Killed: 0, Lived: 0, Not covered: 0$' "$RUNNER_TEMP/mutation.log" \
            && grep -q '^Timed out: 0, ' "$RUNNER_TEMP/mutation.log"; then
            echo "No mutants in the changed lines; nothing to test."
            exit 0
          fi
          exit "$status"
      - name: Upload the mutation log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.shard.name }}
          path: ${{ runner.temp }}/mutation.log
          if-no-files-found: ignore

  # The one required check: branch protection names `mutation`, so shards can
  # be added or renamed without touching it. `always()` makes it run (and fail)
  # when a shard fails or is cancelled instead of being skipped.
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    needs: mutation-shard
    if: always()
    steps:
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.mutation-shard.result }}
        run: |
          echo "mutation shards: $SHARDS_RESULT"
          [ "$SHARDS_RESULT" = success ]

  # noda supports git 2.39 (Debian bookworm) and up; the other jobs run the
  # runner's newer git, so this one builds the floor and runs the suites on it.
  min-git:
    name: min-git (git 2.39)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build git 2.39.5
        run: |
          # libcurl is git-remote-http, which the HTTPS credential tests need;
          # NO_CURL would build a git that cannot speak HTTP at all.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev
          git clone --quiet --depth 1 --branch v2.39.5 https://github.com/git/git "$RUNNER_TEMP/git-src"
          # -std=gnu17: git 2.39 defines its own unreachable(), which a newer
          # compiler's C23 default turns into a macro clash.
          make -C "$RUNNER_TEMP/git-src" -j"$(nproc)" CFLAGS="-g -O2 -std=gnu17" prefix="$RUNNER_TEMP/git-2.39" NO_GETTEXT=1 NO_TCLTK=1 NO_EXPAT=1 NO_PERL=1 NO_PYTHON=1 install
          echo "$RUNNER_TEMP/git-2.39/bin" >> "$GITHUB_PATH"
      - name: The floor is what runs
        run: test "$(git --version)" = "git version 2.39.5"
      - run: go test -mod=vendor ./internal/gitx/... ./internal/notebook/...

  lint-workflow:
    name: lint-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install-action has no actionlint manifest, so download the release and
      # verify its checksum.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
      - run: ./actionlint

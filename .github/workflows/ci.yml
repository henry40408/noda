# The go-build job guards the PRFAQ's claim that noda is one static binary on
# x86_64 and aarch64: a cgo dependency is what breaks that silently.
#
# Actions are pinned to commit SHAs, which cannot be repointed the way a tag can;
# the trailing comment names the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels a pull request's older run; on `main` every commit is
# run to the end, so back-to-back merges each get verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  lint-e2e:
    name: lint-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # `e2e/` is its own workspace; unnamed, its dependencies go uncached.
          workspaces: e2e
      - run: cargo fmt --check --manifest-path e2e/Cargo.toml
      - run: cargo clippy --manifest-path e2e/Cargo.toml --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - run: cargo nextest run

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            e2e
      # Built first so a compile error in noda reads as one, not as a browser
      # finding nothing listening.
      - run: cargo build
      # The runner has Chrome; only the matching chromedriver is downloaded.
      - run: cargo test --manifest-path e2e/Cargo.toml --test e2e

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-llvm-cov installs llvm-tools-preview itself.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov,nextest
      - name: Collect coverage (llvm source-based, via nextest)
        run: cargo llvm-cov nextest --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          # Coverage is a signal, not a gate.
          fail_ci_if_error: false

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      # Can fail with no change here, when a new advisory is published.
      - run: cargo deny check

  go-build:
    name: go-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -mod=vendor -trimpath -o noda ./cmd/noda
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      # noda ships as one file that needs nothing installed but git.
      - name: the binary must be static
        run: |
          file noda
          file noda | grep -Eq 'statically linked' || {
            echo "::error::noda is not statically linked"
            exit 1
          }

  go-deps:
    name: go-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
      - run: scripts/check-dep-age.sh
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # e2e/ is its own module, so none of the above reached it.
      - name: e2e module
        working-directory: e2e
        run: |
          go mod tidy -diff
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
          ../scripts/check-dep-age.sh
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  go-lint:
    name: go-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          unformatted="$(git ls-files -z '*.go' | grep -zvE '(^|/)vendor/' | xargs -0 gofmt -l 2>&1)"
          echo "$unformatted"
          test -z "$unformatted"
      - run: go vet -mod=vendor ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: e2e module
        working-directory: e2e
        run: |
          go vet -mod=vendor ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      # One toolchain for both modules, or a bump in one is missed in the other.
      - name: e2e uses the root go and toolchain lines
        run: |
          for key in go toolchain; do
            test "$(grep "^$key " go.mod)" = "$(grep "^$key " e2e/go.mod)"
          done

  go-test:
    name: go-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -mod=vendor -race ./...

  go-e2e:
    name: go-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # chromedp's own search prefers a chromium on PATH over google-chrome, so
      # the browser the runner reports is pinned.
      - name: Pin the browser
        run: echo "E2E_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: go test -mod=vendor -count=1 -timeout 25m ./...
        working-directory: e2e

  # noda supports git 2.39 (Debian bookworm) and up; the other jobs run the
  # runner's newer git, so this one builds the floor and runs the suites on it.
  go-min-git:
    name: go-min-git (git 2.39)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build git 2.39.5
        run: |
          git clone --quiet --depth 1 --branch v2.39.5 https://github.com/git/git "$RUNNER_TEMP/git-src"
          make -C "$RUNNER_TEMP/git-src" -j"$(nproc)" prefix="$RUNNER_TEMP/git-2.39" NO_GETTEXT=1 NO_TCLTK=1 NO_CURL=1 NO_EXPAT=1 NO_PERL=1 NO_PYTHON=1 install
          echo "$RUNNER_TEMP/git-2.39/bin" >> "$GITHUB_PATH"
      - name: The floor is what runs
        run: test "$(git --version)" = "git version 2.39.5"
      - run: go test -mod=vendor ./internal/gitx/... ./internal/notebook/...

  lint-workflow:
    name: lint-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install-action has no actionlint manifest, so download the release and
      # verify its checksum.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
      - run: ./actionlint

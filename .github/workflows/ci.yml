# The PRFAQ claims noda cross-compiles to musl on x86_64 and aarch64, and that
# claim had nothing guarding it. The cross job exists to keep it honest: the
# vendored libgit2 and OpenSSL are compiled from source for every target, which
# is exactly the part that breaks silently.
#
# Actions are pinned to commit SHAs, not tags. A tag is a movable pointer: whoever
# controls the repository can repoint it at different code, and every workflow
# that trusts the tag runs that code on its next build. A SHA cannot be repointed,
# so what runs here only changes when a commit here says so. The trailing comment
# records which release each SHA is, for humans and for update tooling.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time. A newer push supersedes the run it interrupted;
# a tag does not — a tagged build publishes one specific version and nothing
# should quietly cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-nextest
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run

  e2e:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            e2e
      # `e2e/` is its own workspace, so its lints are its own job as well —
      # sharing this one's build is what keeps that from costing a second
      # compile of thirtyfour.
      - run: cargo fmt --check --manifest-path e2e/Cargo.toml
      - run: cargo clippy --manifest-path e2e/Cargo.toml --all-targets -- -D warnings
      # Built here rather than left to the suite, so a compile error in noda
      # itself is reported as a compile error rather than as a browser that
      # found nothing listening.
      - run: cargo build
      # The runner image carries Google Chrome; the driver manager downloads
      # only the matching chromedriver, never a browser.
      - run: cargo test --manifest-path e2e/Cargo.toml --test e2e

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-deny
      # Advisories, licences, banned crates and sources in one pass. This one
      # can fail without anything here changing — an advisory is published
      # against a dependency and the graph is suddenly not what it was.
      - run: cargo deny check

  cross:
    name: cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --target ${{ matrix.target }}
      # The whole point of vendoring is one file that needs nothing installed.
      # A dynamically linked binary here would be a regression nobody notices
      # until it fails on someone else's machine.
      - name: the binary must be self-contained
        run: |
          binary=target/${{ matrix.target }}/release/noda
          file "$binary"
          file "$binary" | grep -Eq 'static' || {
            echo "::error::$binary is not statically linked"
            exit 1
          }

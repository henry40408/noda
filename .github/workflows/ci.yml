# The PRFAQ claims noda cross-compiles to musl on x86_64 and aarch64, and that
# claim had nothing guarding it. The cross job exists to keep it honest: the
# vendored libgit2 and OpenSSL are compiled from source for every target, which
# is exactly the part that breaks silently.
#
# Actions are pinned to commit SHAs, not tags. A tag is a movable pointer: whoever
# controls the repository can repoint it at different code, and every workflow
# that trusts the tag runs that code on its next build. A SHA cannot be repointed,
# so what runs here only changes when a commit here says so. The trailing comment
# records which release each SHA is, for humans and for update tooling.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run it interrupted; nobody reads the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-nextest
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-deny
      # Advisories, licences, banned crates and sources in one pass. This one
      # can fail without anything here changing — an advisory is published
      # against a dependency and the graph is suddenly not what it was.
      - run: cargo deny check

  cross:
    name: cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --target ${{ matrix.target }}
      # The whole point of vendoring is one file that needs nothing installed.
      # A dynamically linked binary here would be a regression nobody notices
      # until it fails on someone else's machine.
      - name: the binary must be self-contained
        run: |
          binary=target/${{ matrix.target }}/release/noda
          file "$binary"
          file "$binary" | grep -Eq 'static' || {
            echo "::error::$binary is not statically linked"
            exit 1
          }

# The build job guards the PRFAQ's claim that noda builds for musl on x86_64 and
# aarch64: the vendored C libraries are what break silently there.
#
# Actions are pinned to commit SHAs, which cannot be repointed the way a tag can;
# the trailing comment names the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels a pull request's older run; on `main` every commit is
# run to the end, so back-to-back merges each get verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `e2e/` is its own workspace; unnamed, its dependencies go uncached.
          workspaces: |
            .
            e2e
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check --manifest-path e2e/Cargo.toml
      - run: cargo clippy --manifest-path e2e/Cargo.toml --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - run: cargo nextest run

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            e2e
      # Built first so a compile error in noda reads as one, not as a browser
      # finding nothing listening.
      - run: cargo build
      # The runner has Chrome; only the matching chromedriver is downloaded.
      - run: cargo test --manifest-path e2e/Cargo.toml --test e2e

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-llvm-cov installs llvm-tools-preview itself.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov,nextest
      - name: Collect coverage (llvm source-based, via nextest)
        run: cargo llvm-cov nextest --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          # Coverage is a signal, not a gate.
          fail_ci_if_error: false

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      # Can fail with no change here, when a new advisory is published.
      - run: cargo deny check

  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --target ${{ matrix.target }}
      # Vendoring exists to ship one file that needs nothing installed.
      - name: the binary must be self-contained
        run: |
          binary=target/${{ matrix.target }}/release/noda
          file "$binary"
          file "$binary" | grep -Eq 'static' || {
            echo "::error::$binary is not statically linked"
            exit 1
          }

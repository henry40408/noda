# Distribution: the ghcr.io image is the only prebuilt noda (not on crates.io or
# Homebrew). Actions are pinned to SHAs as in ci.yml; this token can write packages.
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  # Pull requests build without publishing, and only when they touch packaging:
  # this job takes 9m24s against 1m27s for ci.yml's cross-compile (the GHA cache
  # does not carry `RUN --mount=type=cache`), and ci.yml already covers the source.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml

# One build per ref, so racing builds cannot leave an older commit as `:main`.
# A `v*` release build is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git describe` needs the tags a shallow fetch omits.
          fetch-depth: 0
      # Described here because `.dockerignore` excludes `.git` from the image.
      - id: version
        run: |
          echo "value=$(git describe --tags --always --match 'v[0-9]*')" >> "$GITHUB_OUTPUT"
      # No qemu: zig cross-compiles arm64 on the native builder.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value={{branch}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: |
            NODA_VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Distribution. noda is not published to crates.io or Homebrew; the container
# image on ghcr.io is how you get a built noda without building it yourself.
#
# Actions are pinned to commit SHAs for the same reason as in ci.yml: a tag can
# be repointed at other code by whoever controls it, and this workflow holds a
# token that can write packages.
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  # Build on pull requests too, without publishing. The image is not exercised
  # by ci.yml, so without this a Dockerfile that no longer builds would only be
  # discovered after it had already landed on main.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No qemu: the Dockerfile's builder stays on the native platform and zig
      # cross-compiles both musl targets, so arm64 needs no emulation.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

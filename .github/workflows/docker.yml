# Distribution. noda is not published to crates.io or Homebrew; the container
# image on ghcr.io is how you get a built noda without building it yourself.
#
# Actions are pinned to commit SHAs for the same reason as in ci.yml: a tag can
# be repointed at other code by whoever controls it, and this workflow holds a
# token that can write packages.
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  # Build on pull requests that touch the packaging, without publishing, so a
  # Dockerfile that no longer builds is caught before it lands rather than after.
  #
  # Only those, though. This job takes 9m24s against 1m27s for the whole of
  # ci.yml's cross-compile, and it does not get faster with a warm cache: the
  # cargo work happens inside a `RUN --mount=type=cache`, which the GHA cache
  # backend does not carry, so any source change rebuilds the vendored OpenSSL
  # and libgit2 from scratch for both architectures. On a source-only pull
  # request that buys nothing either — ci.yml already compiles the same code for
  # both musl targets and asserts the result is statically linked. What is left
  # that only this can catch is the packaging itself, which is what it now
  # watches.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml

# One build per ref at a time. Three merges in quick succession started three
# nine-minute builds racing to push the same `:main` tag, where the winner is
# whichever finished last rather than whichever commit is newer.
#
# Superseding is right for a branch, where the tag always means "latest", and
# wrong for a release: a `v*` build is publishing one specific version and
# nothing should quietly cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No qemu: the Dockerfile's builder stays on the native platform and zig
      # cross-compiles both musl targets, so arm64 needs no emulation.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value={{branch}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

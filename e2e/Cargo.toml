[package]
name = "noda-e2e"
version = "0.0.0"
edition = "2024"
publish = false
description = "Browser end-to-end tests for `noda web`"

# Its own workspace, so the root `cargo nextest run` never compiles a WebDriver
# client or needs a browser.
[workspace]

[dependencies]
anyhow = "1.0.104"
cucumber = "0.23.0"
serde_json = "1.0.151"
# Pinned exactly: 0.37.5 (2026-08-12) was inside the seven-day cooldown for new
# releases. Relax to a caret once it has aged out.
thirtyfour = "=0.37.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "e2e"
harness = false

# The root crate's lint set minus program-only entries; a separate workspace
# inherits none of it.
[lints.rust]
unexpected_cfgs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

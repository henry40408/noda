[package]
name = "noda-e2e"
version = "0.0.0"
edition = "2024"
publish = false
description = "Browser end-to-end tests for `noda web`"

# Deliberately its own workspace, not a member of the one at the repository
# root. `cargo nextest run` at the root is the suite everybody runs, and it
# should not compile a WebDriver client and drive a real browser to answer
# whether `noda ls` still works. Running these is a separate decision, taken by
# running them.
[workspace]

[dependencies]
anyhow = "1.0.104"
# Reads the same Gherkin the features are written in, so what a scenario says
# is independent of what runs it.
cucumber = "0.23.0"
serde_json = "1.0.151"
# Pinned exactly: 0.37.5 was published 2026-08-12, inside the seven-day cooldown
# this project applies to fresh releases. Relax to a caret once it has aged out.
thirtyfour = "=0.37.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "e2e"
harness = false

# Mirrors the root crate's lint set, minus the entries that only apply to the
# program. A separate workspace inherits none of it, and test code that lints
# differently from the code it tests drifts.
[lints.rust]
unexpected_cfgs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

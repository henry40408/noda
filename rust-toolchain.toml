# Pinned so local, CI and release builds use the same compiler: a new clippy
# cannot turn CI red on its own, at the cost of breaking changes surfacing only
# when this is bumped. The musl targets are declared here so the release
# cross-compile is reproducible locally.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]

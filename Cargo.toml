[package]
name = "noda"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# 傳輸永遠內建：GitHub/GitLab 必走 HTTPS/SSH，不做成 feature 開關。
# vendored-*：libgit2 / openssl 全部從源碼編入，換來單一靜態執行檔 + 乾淨跨編（musl/arm64）。
git2 = { version = "0.21.0", default-features = false, features = [
    "vendored-libgit2",
    "https",
    "ssh",
    "vendored-openssl",
] }

[package]
name = "noda"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Cold start dominates every quick `noda ls`, and it scales with how much of the
# binary has to be paged in. Vendoring libgit2/OpenSSL makes that binary large, so
# the release profile is tuned for size: measured with scripts/bench-coldstart.sh.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# Both are already in the tree by way of clap, so reaching for them directly adds
# no supply-chain surface. anstream detects the terminal, honours NO_COLOR, and
# strips the escape codes when output goes to a pipe or a file — which is what
# makes the bytes `noda show` emits identical to the file itself.
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.2", features = ["derive"] }
# Only `std`: the default features bundle a copy of the tz database and read the
# system zone, and noda does neither. It records instants in UTC and prints them
# back as they were written, so `Timestamp` is the whole of what it needs.
#
# Hand-rolling this was the alternative and would have been about sixty lines.
# The line is the parsing: a note that came from elsewhere carries a UTC offset
# (`2019-03-14T16:21:00+08:00`), and an offset is where a hand-written date
# parser starts getting the day rollover wrong.
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
# The transports are always compiled in: GitHub and GitLab are reached over HTTPS
# or SSH, so a build that made either optional could not sync to the hosts every
# user actually targets.
# vendored-*: libgit2 and OpenSSL are built from source into the binary, which is
# what buys a single static executable and a clean cross-compile (musl/arm64).
git2 = { version = "0.21.0", default-features = false, features = [
    "vendored-libgit2",
    "https",
    "ssh",
    "vendored-openssl",
] }
# The parser and nothing else: the default features add getopts and an HTML
# renderer, which are what pulldown-cmark's own example CLI uses. noda reads the
# event stream and renders nothing.
#
# A hand-rolled regex would not do. It cannot resolve reference-style links, and
# it cannot tell that a link inside a code fence is not a link — and both of
# those are how an attachment gets reported as an orphan when it is not one.
pulldown-cmark = { version = "0.13.4", default-features = false }
# `noda import` reads a JSON export somebody else's program wrote. noda writes
# its own JSON by hand — one object of five string fields does not justify a
# crate — but reading is the other direction: a hand-written parser for a file
# that may be tens of megabytes of arbitrary text is the kind of code that is
# fine until it is not.
serde_json = "1.0.151"
toml_edit = "0.25.13"
# The one screen noda draws, for `noda tui`. Every other command prints a string
# and stops; a browser has to keep a terminal in raw mode, survive a resize,
# measure a wide character before laying a column out and redraw only what
# changed — which is a library, not an afternoon.
#
# One dependency and not two: ratatui re-exports crossterm (`ratatui::crossterm`),
# so the backend, the terminal control and the key events all arrive through the
# crate that is already here.
#
# The default features are off because they are for other people's programs: a
# calendar widget, a macro crate, and a colour-space conversion library. What is
# left is the widgets, the layout solver and the crossterm backend.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

# `noda web`. The cost lands on every other command — a bigger binary is more of
# it to page in, and a quick `noda ls` is mostly page-in — so it is measured on
# every change to this section and reported, not assumed. See the README's
# cold-start note and scripts/bench-coldstart.sh.
#
# Why an async stack for a program whose every request is blocking file and
# libgit2 work: the small synchronous HTTP crates are all unmaintained
# (tiny_http's last release is 2022, rouille's 2023), and this is a server whose
# parser meets input nobody here controls. Between "the shape fits" and "someone
# is still fixing it", the second wins.
#
# The mismatch is paid for honestly rather than hidden: `git2::Repository` is
# `!Send`, so it cannot be held across an await at all, and every handler does
# its work inside `spawn_blocking`. That is not a workaround — opening the
# notebook per request is what a `!Send` handle requires anyway.
#
# Features: `http1` and `tokio` are the server, `query` is the `?q=` on the
# listing. No `json` (nothing here speaks it), no `tracing`, no `http2` — a
# notebook on a tailnet is not multiplexing streams.
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "tokio",
    "query",
] }
# The runtime and nothing else: no timers, no signals, no process spawning. The
# blocking pool that `rt-multi-thread` brings is the part that matters, because
# that is where every one of these handlers actually runs.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "net",
] }

# Only the browser's end-to-end tests use these, so they cost the shipped binary
# and its cold start nothing.
#
# The reason a crate is needed at all rather than sixty lines of FFI: opening a
# pty is `openpty(3)`, and `unsafe_code = "deny"` is a line above. portable-pty
# is wezterm's own pty layer, so it is what a real terminal emulator uses.
#
# vt100 is the other half. A pty hands back a byte stream, and what a test wants
# to assert on is the screen those bytes leave behind — so something has to keep
# the grid, honour the cursor moves and the erases, and answer "what does row 9
# say now". That is a terminal emulator's state machine; writing a partial one
# was how this was done before, and a partial one is wrong about exactly the
# things (wrapping, scroll regions) that a layout bug hides behind.
[dev-dependencies]
portable-pty = "0.9.0"
vt100 = "0.16.2"

# Lints encoded in-manifest so `cargo build`/`cargo clippy` and IDEs apply them
# without extra flags (CI additionally runs `clippy --all-targets -- -D warnings`,
# which promotes every one of these warnings to a hard error). Kept 1:1 with the
# sibling `pingward` project's curated set so both repos enforce the same rules.
# Self-maintained lint set (originally seeded from Embark Studios' rust-ecosystem
# list). The bulk of the old itemised pedantic lints are now covered by the
# `pedantic` group; only the noisy/low-signal ones are opted back out, plus the
# restriction and nursery lints that have no safe umbrella group.
[lints.rust]
unexpected_cfgs = "deny"
unsafe_code = "deny"

[lints.clippy]
# Groups (priority -1 so the individual entries below win).
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Opt out of the noisy / low-signal pedantic lints.
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
duration_suboptimal_units = "allow"
items_after_statements = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"

# Restriction lints (no safe umbrella group — kept itemised).
dbg_macro = "warn"
exit = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_add = "warn"
todo = "warn"
unimplemented = "warn"
verbose_file_reads = "warn"

# Nursery picks (the nursery group as a whole is too unstable to enable).
debug_assert_with_mut_call = "warn"
fallible_impl_from = "warn"
trait_duplication_in_bounds = "warn"

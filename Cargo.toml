[package]
name = "noda"
# A placeholder nothing reads: noda is not on crates.io, releases are `gh release`
# tags, and build.rs stamps the real version into the binary.
version = "0.1.0"
edition = "2024"
license = "MIT"

# Cold start dominates a quick `noda ls` and scales with binary size, and vendored
# libgit2/OpenSSL make the binary large, so the profile is tuned for size
# (measured with scripts/bench-coldstart.sh).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# Already in the tree via clap. anstream honours NO_COLOR and strips escapes when
# output is not a terminal, so a piped `noda show` emits the file's exact bytes.
anstream = "1.0.0"
anstyle = "1.0.14"
# `env` is only for `--log-format`, usually set by a unit file or container
# alongside `RUST_LOG`; everything else is `config.toml` and flags.
clap = { version = "4.6.2", features = ["derive", "env"] }
# Only `std`: noda records UTC instants and needs no tz database. Chosen over ~60
# hand-rolled lines because imported notes carry UTC offsets, where a hand-written
# parser gets the day rollover wrong.
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
# HTTPS and SSH are always compiled in: they are how GitHub and GitLab are reached.
# vendored-*: libgit2 and OpenSSL built from source, for a single static
# executable and a clean musl/arm64 cross-compile.
git2 = { version = "0.21.0", default-features = false, features = [
    "vendored-libgit2",
    "https",
    "ssh",
    "vendored-openssl",
] }
# `html` (one extra crate, pulldown-cmark-escape) rather than a second renderer:
# noda's link and raw-HTML policy is applied by rewriting events before rendering.
# A regex could not resolve reference links or skip code fences, which is how an
# attachment gets misreported as an orphan.
pulldown-cmark = { version = "0.13.4", default-features = false, features = [
    "html",
] }
# Reads `noda import`'s JSON, which may be megabytes of foreign text; noda writes
# its own small JSON by hand.
serde_json = "1.0.151"
toml_edit = "0.25.13"
# `noda tui`: raw mode, resize, wide-character width and diffed redraws are a
# library, not an afternoon. crossterm comes re-exported as `ratatui::crossterm`;
# the default features (calendar, macros, palette) are for other programs.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

# `noda web`. Its size costs every command's cold start, so changes to this
# section are measured with scripts/bench-coldstart.sh, not assumed.
#
# Async despite blocking work because the small sync HTTP crates are unmaintained
# (tiny_http last released 2022, rouille 2023) and this parser meets untrusted
# input. `git2::Repository` is `!Send`, so every handler runs in `spawn_blocking`.
#
# `query` is the listing's `?q=`. No `json`, `http2`, or axum's `tracing`:
# request logging is noda's own middleware.
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "tokio",
    "query",
    # The route template: the only name `web::log` may give a request, because
    # the path holds a note's id or a file's name.
    "matched-path",
] }
# gzip, measured (release, 200-note notebook): a sort-switch fragment
# 74,163 -> 4,043 bytes (-94.6%), a listing 75,900 -> 4,802, the stylesheet
# 39,598 -> 12,489; binary +66,208 bytes (+0.87%), cold start within noise.
# Sending only the new row order came to 4,704 bytes, more than gzip, and needed
# a new protocol. No brotli or zstd: a second encoding pays again for the same 94%.
tower-http = { version = "0.7.0", default-features = false, features = [
    "compression-gzip",
] }
# No timers, process or `fs`; `rt-multi-thread` is for its blocking pool, where
# every handler runs. `signal` + `macros` (`tokio::select!` on SIGINT/SIGTERM) let
# `noda web` finish a background `push` rather than leave `index.lock` behind (see
# `web::serve`); they add no crate, +33,168 bytes (+0.43%). `sync` is the channel
# in `web::watch`, whose tick is a `Condvar` thread so the runtime stays I/O-only.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "signal",
    "macros",
    "sync",
] }
# The `Stream` trait for `web::watch`'s SSE response; axum does not re-export it.
# Already compiled via axum-core, so nothing new arrives (unlike `tokio-stream`).
futures-core = { version = "0.3.34", default-features = false }
# Server logs. `tracing` rather than `log` because events carry fields (method,
# route, status, duration) that can be filtered on.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Off: `tracing-log` (nothing writes to `log`) and `smallvec` (code size for
# allocations one line per request does not need). No `env-filter`: its regex
# engine measured +530,080 bytes (+7.24%) against +166,016 (+2.27%) for `Targets`
# (the filter alone 355 KB, 69% of the logging). `Targets`
# which reads the same `RUST_LOG` directives but cannot filter on spans or fields,
# which noda does not use.
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    # `NO_COLOR` is honoured by hand in `web::log`.
    "ansi",
    "registry",
    "json",
] }

# For tests/pty.rs only, so they cost the shipped binary nothing. portable-pty
# (wezterm's pty layer) because `openpty(3)` is FFI and `unsafe_code = "deny"`;
# vt100 because a hand-written partial emulator got wrapping and scroll regions
# wrong, which is where layout bugs hide.
[dev-dependencies]
portable-pty = "0.9.0"
vt100 = "0.16.2"

# In the manifest so every build and IDE applies them; CI adds `-D warnings`.
# Kept in step with the sibling `pingward` project.
[lints.rust]
unexpected_cfgs = "deny"
unsafe_code = "deny"

[lints.clippy]
# Priority -1 so the individual entries below win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Noisy / low-signal pedantic lints.
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
duration_suboptimal_units = "allow"
items_after_statements = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"

# Restriction lints (no safe umbrella group).
dbg_macro = "warn"
exit = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_add = "warn"
todo = "warn"
unimplemented = "warn"
verbose_file_reads = "warn"

# Nursery picks (the group as a whole is too unstable).
debug_assert_with_mut_call = "warn"
fallible_impl_from = "warn"
trait_duplication_in_bounds = "warn"

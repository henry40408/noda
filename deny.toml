# cargo-deny configuration — supply-chain checks for the dependency graph.
# Run locally with `cargo deny check`; CI runs the same on every push and PR.

[graph]
# Check the dependency graph for all targets, not just the host's, so a
# platform-specific dependency can't smuggle in a bad license or advisory.
# It matters more here than in most crates: the vendored libgit2, libssh2 and
# OpenSSL are compiled from source for whatever target is being built.
all-features = true

[advisories]
version = 2
# Deny crates with a known security advisory (RUSTSEC) or that have been yanked.
yanked = "deny"
# Advisory IDs reviewed and consciously accepted go here, each with a note
# saying why. An entry is a debt, not a dismissal: it says the graph is knowingly
# carrying something, and it is expected to be removed rather than to settle in.
ignore = [
    # `libssh2-sys 0.3.2` was published to carry backported patches for three
    # libssh2 CVEs and went out with the *unpatched* submodule in the tarball;
    # it was yanked for that on 2026-09-05 and `0.3.3` is the first release that
    # actually contains them.
    #
    # **So this is not "the yank does not matter" — the graph really is carrying
    # an unpatched libssh2.** Two of the three are reachable from here: the
    # chacha20-poly1305 path of `_libssh2_transport_read` and the pre-auth
    # `EXT_INFO` handler are both on the wire for any SSH remote, and libssh2 is
    # vendored into every build. The third is SFTP, which libgit2 never calls.
    #
    # It is here only because `0.3.3` was published the same day it was needed,
    # inside the seven-day cooldown this project applies to a dependency bump —
    # a new release being the thing that cooldown exists to catch. #114 carries
    # the date and the reasoning; this entry goes with the bump.
    { crate = "libssh2-sys@0.3.2", reason = "yanked for a packaging fault; the fixed 0.3.3 is inside the dependency cooldown until 2026-09-12 — see #114" },
]

[licenses]
version = 2
# Permissive / public-domain-equivalent licenses only, trimmed to the ones this
# graph actually contains rather than every licence we would be willing to
# accept. A dependency that introduces a new one fails the check on purpose:
# review it, then add it here. `cargo deny list` shows what is in use.
allow = [
    "Apache-2.0",
    "MIT",
    # foldhash, which arrives under hashbrown when ratatui's layout solver pulls
    # it in. Permissive in the same way the three above are — attribution, no
    # conditions on distributing a binary — and OSI approved.
    "Zlib",
    "Unicode-3.0",
    # matchit, which is axum's router. Its licence is `MIT AND BSD-3-Clause`:
    # the crate is MIT, and the routing algorithm it is a port of came from a Go
    # library that is BSD-3-Clause, so both travel with it. Permissive in the
    # same way the rest of this list is — attribution, and a clause saying the
    # authors' names may not be used to endorse what is built on it — with no
    # condition on distributing a binary.
    "BSD-3-Clause",
]
confidence-threshold = 0.8

[bans]
# Duplicate transitive versions are common; surface them as a warning, not a
# hard failure.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io is trusted; an unknown registry or any git source is rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

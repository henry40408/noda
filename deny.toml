# Supply-chain checks: `cargo deny check`, run by CI on every push and PR.

[graph]
# All features, and (no `targets` list) every target rather than the host's:
# the vendored libgit2, libssh2 and OpenSSL are compiled for whatever is built.
all-features = true

[advisories]
version = 2
yanked = "deny"
# Accepted advisory IDs, each with a note saying why. An entry is a debt to be
# removed, not a dismissal.
ignore = []

[licenses]
version = 2
# Only the permissive licences this graph actually contains, so a new one fails
# the check until reviewed. `cargo deny list` shows what is in use.
allow = [
    "Apache-2.0",
    "MIT",
    # foldhash, via hashbrown under ratatui's layout solver.
    "Zlib",
    "Unicode-3.0",
    # matchit (axum's router): `MIT AND BSD-3-Clause`, as a port of a BSD Go
    # library. No condition on distributing a binary.
    "BSD-3-Clause",
]
confidence-threshold = 0.8

[bans]
# Duplicate transitive versions are common: a warning, not a failure.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io; any other registry or git source is rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
